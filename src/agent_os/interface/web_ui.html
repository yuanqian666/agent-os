<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent OS 可视化面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f1420; color: #d8e0f0; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #6fd0ff; }
  .sub { color: #7a8699; font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #161d2e; border: 1px solid #26314a; border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 14px; color: #9db4d6; margin-bottom: 10px; border-bottom: 1px solid #26314a; padding-bottom: 6px; }

  /* ===== 自上而下的树（组织结构图） ===== */
  .tree-wrap { overflow-x: auto; padding: 8px 0 16px; }
  .tree { display: flex; justify-content: center; font-size: 12px; }
  .tree ul { display: flex; padding-top: 24px; position: relative; justify-content: center; }
  .tree li { display: flex; flex-direction: column; align-items: center; list-style: none;
             padding: 24px 6px 0; position: relative; }
  /* 连接线：子节点上方竖线 + 兄弟横线 */
  .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%;
             border-top: 2px solid #2c3a58; width: 50%; height: 24px; }
  .tree li::after { right: auto; left: 50%; border-left: 2px solid #2c3a58; }
  .tree li:only-child::before, .tree li:only-child::after { display: none; }
  .tree li:only-child { padding-top: 0; }
  .tree li:first-child::before, .tree li:last-child::after { border: 0 none; }
  .tree li:last-child::before { border-right: 2px solid #2c3a58; border-radius: 0 6px 0 0; }
  .tree li:first-child::after { border-radius: 6px 0 0 0; }
  .tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%;
             border-left: 2px solid #2c3a58; width: 0; height: 24px; }
  .tree ul:first-child > li::before, .tree ul:first-child > li::after { display: none; }
  /* 根节点上方无线 */
  .tree > ul { padding-top: 0; }
  .tree > ul::before, .tree > ul > li::before, .tree > ul > li::after { display: none; }

  .node { display: inline-flex; flex-direction: column; align-items: center; gap: 4px;
          background: #1d2942; border: 1px solid #2e4066; border-radius: 8px;
          padding: 6px 14px; min-width: 96px; transition: all 0.3s; }
  .node .row { display: flex; align-items: center; gap: 6px; }
  .node .dot { width: 9px; height: 9px; border-radius: 50%; background: #5b6b85; flex-shrink: 0; }
  .node .role { font-weight: bold; }
  .role-root { color: #ffb86b; } .role-agent { color: #6fd0ff; }
  .role-haa { color: #ff7b9c; } .role-interface { color: #9db4d6; }
  .node .id { color: #d8e0f0; font-family: Consolas, monospace; font-size: 11px; }
  .node .meta { color: #7a8699; font-size: 10px; }
  .node .gene { color: #7ee787; font-size: 10px; }
  .node .lin { color: #5b6b85; font-size: 10px; }
  /* 状态 */
  .st-idle .dot { background: #5b6b85; }
  .st-running .dot { background: #ffb86b; animation: pulse 1s infinite; }
  .st-completed .dot { background: #7ee787; }
  .st-error .dot { background: #ff6b6b; animation: pulse 0.5s infinite; }
  @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
  .node.spawn { animation: spawn 0.6s ease-out; }
  @keyframes spawn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .node.gone { opacity: 0.35; border-style: dashed; }
  .node.gone::after { content: "已销毁"; color: #5b6b85; font-size: 9px; }
  .tree li.gone-branch::before, .tree li.gone-branch::after { border-color: #1c2740; }

  /* 日志 */
  #logs { height: 380px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; }
  .lv-EVENT { color: #5b6b85; } .lv-TASK { color: #6fd0ff; }
  .lv-STATUS { color: #7ee787; } .lv-INFO { color: #9db4d6; }
  .lv-ERROR { color: #ff6b6b; } .lv-WARN { color: #ffb86b; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #222c44; }
  th { color: #9db4d6; }
  .statusbar { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #7a8699; }
  .statusbar b { color: #d8e0f0; }
</style>
</head>
<body>
<h1>Agent OS 可视化面板</h1>
<div class="sub">自上而下 Agent 树 · 上报顺族系 · 下放顺公链（HAA→族系子→Root）</div>
<div class="statusbar">
  <span>沙箱数: <b id="cnt">0</b></span>
  <span>Root 状态: <b id="rootstate">-</b></span>
  <span>日志条数: <b id="logcnt">0</b></span>
  <span>历史任务: <b id="histcnt">0</b></span>
</div>
<div class="grid">
  <div class="card">
    <h2>Agent 树（自上而下，动态）</h2>
    <div class="tree-wrap"><div class="tree" id="tree"><span style="color:#5b6b85">等待系统启动...</span></div></div>
  </div>
  <div class="card">
    <h2>工作流日志（实时）</h2>
    <div id="logs"></div>
  </div>
</div>
<div class="card" style="margin-top:12px;">
  <h2>运行历史（runtime_log）</h2>
  <table id="hist">
    <thead><tr><th>时间</th><th>任务</th><th>结果</th><th>族系</th><th>能力</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>
let lastLogId = 0;
let nodeHistory = new Map();   // sandbox_id -> 节点
const GONE_TTL = 15000;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadState() {
  try {
    const r = await fetch("/api/state"); const data = await r.json();
    const nodes = data.nodes || [];
    document.getElementById("cnt").textContent = nodes.length;
    const now = Date.now();
    const alive = new Set();
    nodes.forEach(n => { alive.add(n.sandbox_id); n.gone = false; n.seenAt = now;
                         nodeHistory.set(n.sandbox_id, n); });
    nodeHistory.forEach((n, id) => {
      if (!alive.has(id)) {
        if (!n.gone) n.gone = true;
        if (now - (n.seenAt || now) > GONE_TTL) nodeHistory.delete(id);
      }
    });
    const root = nodes.find(n => n.role === "root");
    document.getElementById("rootstate").textContent = root ? (root.state || "-") : "-";
    renderTree();
  } catch (e) { /* 服务重启中 */ }
}

// ---- 显示树构建：HAA 动态挂载到携带其基因的族系子下 ----
// 初始：root 直连 HAA；root 繁殖出携带基因的族系子后，该 HAA 的
// 显示父变为族系子（root 经子 agent 间接连接 HAA，符合公链语义）。
// HAA 记住 bestCarrier：存活优先，销毁后保留灰显挂载（不立即回挂 root）。
function buildDisplayTree() {
  const nodes = [...nodeHistory.values()];
  nodes.filter(n => n.role === "haa").forEach(haa => {
    // 存活族系子优先（出现即刷新 bestCarrier）；销毁不撤销
    const alive = nodes.find(n => n.role === "agent" && n.alive !== false &&
                     (n.haa_identifiers || []).includes(haa.sandbox_id));
    if (alive) { haa.bestCarrier = alive.sandbox_id; return; }
    // 无存活承载者：若从未记住，则从历史（含已销毁）推断拓扑关系
    if (!haa.bestCarrier) {
      const any = nodes.find(n => n.role === "agent" &&
                       (n.haa_identifiers || []).includes(haa.sandbox_id));
      if (any) haa.bestCarrier = any.sandbox_id;
    }
  });
  const dispParent = n => {
    if (n.role === "haa" && n.bestCarrier && nodeHistory.has(n.bestCarrier))
      return n.bestCarrier;                 // 挂到（含已销毁的）承载族系子下
    return n.parent_id;                     // 从未承载 → registry 父（root）
  };
  return { nodes, dispParent };
}

function isRoot(n, dispParent) {
  const p = dispParent(n);
  return !p || p === "interface" || p === "os" || !nodeHistory.has(p);
}

function childrenOf(parentId, dispParent) {
  return [...nodeHistory.values()].filter(n => dispParent(n) === parentId);
}

function renderNode(n, dispParent) {
  const kids = childrenOf(n.sandbox_id, dispParent);
  const st = n.gone ? "gone" : ("st-" + (n.state || "idle"));
  const spawn = n.seenAt && (Date.now() - n.seenAt < 700) ? " spawn" : "";
  const genes = (n.haa_identifiers || []).length
      ? `<span class="gene">[${esc((n.haa_identifiers||[]).join(","))}]</span>` : "";
  const lin = n.lineage_tag ? `<span class="lin">${esc(n.lineage_tag)}</span>` : "";
  const stateTxt = n.gone ? "" : (n.state || "");
  const kidsHtml = kids.length
      ? "<ul>" + kids.map(k => renderNode(k, dispParent)).join("") + "</ul>" : "";
  return `<li><div class="node ${st}${spawn}"><div class="row"><span class="dot"></span>` +
    `<span class="role role-${n.role}">${esc(n.role)}</span></div>` +
    `<span class="id">${esc(n.sandbox_id)}</span>${genes}${lin}` +
    `<span class="meta">${esc(stateTxt)}</span></div>${kidsHtml}</li>`;
}

function renderTree() {
  const { nodes, dispParent } = buildDisplayTree();
  const roots = nodes.filter(n => isRoot(n, dispParent));
  if (!roots.length) {
    document.getElementById("tree").innerHTML = '<span style="color:#5b6b85">（空）</span>';
    return;
  }
  document.getElementById("tree").innerHTML = "<ul>" + roots.map(r => renderNode(r, dispParent)).join("") + "</ul>";
}

async function loadLogs() {
  try {
    const r = await fetch("/api/logs?id=" + lastLogId);
    const entries = await r.json();
    if (!entries.length) return;
    const box = document.getElementById("logs");
    entries.forEach(e => {
      lastLogId = Math.max(lastLogId, e.id);
      const div = document.createElement("div");
      div.className = "lv-" + e.level;
      div.textContent = `[${e.ts}] [${e.level}] ${e.msg}`;
      box.appendChild(div);
    });
    document.getElementById("logcnt").textContent = lastLogId;
    box.scrollTop = box.scrollHeight;
  } catch (e) {}
}

async function loadHistory() {
  try {
    const r = await fetch("/api/history"); const recs = await r.json();
    document.getElementById("histcnt").textContent = recs.length;
    const tb = document.querySelector("#hist tbody");
    tb.innerHTML = recs.slice().reverse().slice(0, 20).map(x =>
      `<tr><td>${esc(x.time)}</td><td>${esc(x.task_id)}</td>` +
      `<td>${esc(JSON.stringify(x.result || {}))}</td>` +
      `<td>${esc((x.lineages||[]).join(", "))}</td>` +
      `<td>${esc((x.composite_skills||[]).join(", "))}</td></tr>`).join("");
  } catch (e) {}
}

setInterval(loadState, 800);
setInterval(loadLogs, 1000);
setInterval(loadHistory, 3000);
loadState(); loadLogs(); loadHistory();
</script>
</body>
</html>
