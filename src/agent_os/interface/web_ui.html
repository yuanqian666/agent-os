<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Agent OS 可视化面板</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #0f1420; color: #d8e0f0; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #6fd0ff; }
  .sub { color: #7a8699; font-size: 12px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #161d2e; border: 1px solid #26314a; border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 14px; color: #9db4d6; margin-bottom: 10px; border-bottom: 1px solid #26314a; padding-bottom: 6px; }
  /* ===== 树形（嵌套 + 连接线） ===== */
  .tree { font-size: 13px; }
  .tree ul { list-style: none; padding-left: 22px; margin-left: 8px; border-left: 2px solid #2c3a58; }
  .tree > ul { border-left: none; padding-left: 0; margin-left: 0; }
  .tree li { margin: 6px 0; position: relative; }
  .tree li::before { content: ""; position: absolute; left: -16px; top: 50%; width: 14px; height: 2px; background: #2c3a58; }
  .tree > ul > li::before { display: none; }
  .node { display: inline-flex; align-items: center; gap: 8px; background: #1d2942; border: 1px solid #2e4066; border-radius: 6px; padding: 5px 10px; transition: all 0.3s; }
  .node .dot { width: 10px; height: 10px; border-radius: 50%; background: #5b6b85; flex-shrink: 0; }
  .node .role { font-weight: bold; }
  .role-root { color: #ffb86b; } .role-agent { color: #6fd0ff; }
  .role-haa { color: #ff7b9c; } .role-interface { color: #9db4d6; }
  .node .meta { color: #7a8699; font-size: 11px; }
  .node .gene { color: #7ee787; font-size: 11px; }
  /* 状态 */
  .st-idle .dot { background: #5b6b85; }
  .st-running .dot { background: #ffb86b; animation: pulse 1s infinite; }
  .st-completed .dot { background: #7ee787; }
  .st-error .dot { background: #ff6b6b; }
  .st-error .dot { animation: pulse 0.5s infinite; }
  .node.gone { opacity: 0.35; border-style: dashed; }
  .node.gone::after { content: "（已销毁）"; color: #5b6b85; font-size: 10px; }
  @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
  .node.spawn { animation: spawn 0.6s ease-out; }
  @keyframes spawn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  /* 日志 */
  #logs { height: 380px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; line-height: 1.5; }
  .lv-EVENT { color: #5b6b85; } .lv-TASK { color: #6fd0ff; }
  .lv-STATUS { color: #7ee787; } .lv-INFO { color: #9db4d6; }
  .lv-ERROR { color: #ff6b6b; } .lv-WARN { color: #ffb86b; }
  /* 历史 */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #222c44; }
  th { color: #9db4d6; }
  .statusbar { display: flex; gap: 16px; margin-bottom: 12px; font-size: 12px; color: #7a8699; }
  .statusbar b { color: #d8e0f0; }
</style>
</head>
<body>
<h1>Agent OS 可视化面板</h1>
<div class="sub">递归沙箱 · 文件即一切 · 族系=任务拆解 · 基因=公链可达 · 上报顺族系 · 下放顺公链</div>
<div class="statusbar">
  <span>沙箱数: <b id="cnt">0</b></span>
  <span>Root 状态: <b id="rootstate">-</b></span>
  <span>日志条数: <b id="logcnt">0</b></span>
  <span>历史任务: <b id="histcnt">0</b></span>
</div>
<div class="grid">
  <div class="card">
    <h2>Agent 树（动态）</h2>
    <div class="tree" id="tree"><span style="color:#5b6b85">等待系统启动...</span></div>
  </div>
  <div class="card">
    <h2>工作流日志（实时）</h2>
    <div id="logs"></div>
  </div>
</div>
<div class="card" style="margin-top:12px;">
  <h2>运行历史（runtime_log）</h2>
  <table id="hist">
    <thead><tr><th>时间</th><th>任务</th><th>结果</th><th>族系</th><th>能力</th></tr></thead>
    <tbody></tbody>
  </table>
</div>
<script>
let lastLogId = 0;
let nodeHistory = new Map();   // sandbox_id -> 节点（含已销毁的历史）
const GONE_TTL = 15000;        // 已销毁节点保留 15s

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function loadState() {
  try {
    const r = await fetch("/api/state"); const data = await r.json();
    const nodes = data.nodes || [];
    document.getElementById("cnt").textContent = nodes.length;
    const now = Date.now();
    // 更新历史：现有节点刷新；消失节点标记 gone
    const alive = new Set();
    nodes.forEach(n => {
      alive.add(n.sandbox_id);
      n.gone = false; n.seenAt = now;
      nodeHistory.set(n.sandbox_id, n);
    });
    nodeHistory.forEach((n, id) => {
      if (!alive.has(id)) {
        if (!n.gone) n.gone = true;
        if (now - (n.seenAt || now) > GONE_TTL) nodeHistory.delete(id);
      }
    });
    const root = nodes.find(n => n.role === "root");
    document.getElementById("rootstate").textContent = root ? (root.state || "-") : "-";
    renderTree();
  } catch (e) { /* 服务重启中 */ }
}

function childrenOf(parentId) {
  return [...nodeHistory.values()].filter(n => (n.parent_id || "") === (parentId || ""));
}

function isRoot(n) {
  const p = n.parent_id;
  return !p || p === "interface" || p === "os" || !nodeHistory.has(p);
}

function renderNode(n) {
  const kids = childrenOf(n.sandbox_id);
  const st = n.gone ? "gone" : ("st-" + (n.state || "idle"));
  const cls = "role-" + n.role;
  const gene = (n.haa_identifiers || []).length ? `<span class="gene">[${esc((n.haa_identifiers||[]).join(","))}]</span>` : "";
  const lin = n.lineage_tag ? `<span class="meta">${esc(n.lineage_tag)}</span>` : "";
  const kidsHtml = kids.length ? "<ul>" + kids.map(renderNode).join("") + "</ul>" : "";
  const spawn = n.seenAt && (Date.now() - n.seenAt < 700) ? " spawn" : "";
  return `<li><div class="node ${st}${spawn}"><span class="dot"></span>` +
    `<span class="role ${cls}">${esc(n.role)}</span><span>${esc(n.sandbox_id)}</span>` +
    `${gene}${lin}</div>${kidsHtml}</li>`;
}

function renderTree() {
  const roots = [...nodeHistory.values()].filter(isRoot);
  if (!roots.length) {
    document.getElementById("tree").innerHTML = '<span style="color:#5b6b85">（空）</span>';
    return;
  }
  document.getElementById("tree").innerHTML = "<ul>" + roots.map(renderNode).join("") + "</ul>";
}

async function loadLogs() {
  try {
    const r = await fetch("/api/logs?id=" + lastLogId);
    const entries = await r.json();
    if (!entries.length) return;
    const box = document.getElementById("logs");
    entries.forEach(e => {
      lastLogId = Math.max(lastLogId, e.id);
      const div = document.createElement("div");
      div.className = "lv-" + e.level;
      div.textContent = `[${e.ts}] [${e.level}] ${e.msg}`;
      box.appendChild(div);
    });
    document.getElementById("logcnt").textContent = lastLogId;
    box.scrollTop = box.scrollHeight;
  } catch (e) { /* 忽略 */ }
}

async function loadHistory() {
  try {
    const r = await fetch("/api/history"); const recs = await r.json();
    document.getElementById("histcnt").textContent = recs.length;
    const tb = document.querySelector("#hist tbody");
    tb.innerHTML = recs.slice().reverse().slice(0, 20).map(x =>
      `<tr><td>${esc(x.time)}</td><td>${esc(x.task_id)}</td>` +
      `<td>${esc(JSON.stringify(x.result || {}))}</td>` +
      `<td>${esc((x.lineages||[]).join(", "))}</td>` +
      `<td>${esc((x.composite_skills||[]).join(", "))}</td></tr>`).join("");
  } catch (e) { /* 忽略 */ }
}

setInterval(loadState, 800);   // 更快刷新：看到族系子"生长"
setInterval(loadLogs, 1000);
setInterval(loadHistory, 3000);
loadState(); loadLogs(); loadHistory();
</script>
</body>
</html>
